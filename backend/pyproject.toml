[project]
name = "carpet-ai-assistant"
version = "0.1.0"
description = "AI customer assistant for a carpet-cleaning business (RAG + tool calling)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",  # IANA timezones for zoneinfo (Windows has none built in)
    "pgvector>=0.3",  # vector column type for SQLAlchemy
    "httpx2>=2.13",  # HTTP client (Voyage AI API); also used by the Anthropic SDK
    "anthropic>=1.13",  # Claude API
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses calls in default arguments (Depends(...)).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
