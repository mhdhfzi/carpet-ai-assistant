# Local development services. Start with: docker compose up -d
services:
  db:
    # Official Postgres 16 image with the pgvector extension pre-installed.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpet}
      POSTGRES_DB: ${POSTGRES_DB:-carpet}
    ports:
      # Bound to localhost only so the dev database isn't exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The production image, for trying the whole stack locally:
  #   docker compose --profile app up --build
  # then open http://localhost:8080 (run migrations first:
  #   docker compose --profile app run --rm app alembic upgrade head)
  app:
    profiles: ["app"]
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carpet}:${POSTGRES_PASSWORD:-carpet}@db:5432/${POSTGRES_DB:-carpet}
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
