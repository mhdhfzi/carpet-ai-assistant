name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A newer push to a PR cancels the run still in progress. Runs on main queue instead,
# so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_ID: kilau-assistant
  REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/kilau-assistant/kilau/app

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same image as docker-compose.yml, so tests run against real Postgres + pgvector.
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: carpet
          POSTGRES_PASSWORD: carpet
          POSTGRES_DB: carpet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carpet -d carpet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carpet:carpet@127.0.0.1:5432/carpet
      TEST_DATABASE_URL: postgresql+psycopg://carpet:carpet@127.0.0.1:5432/carpet_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # the production version (Dockerfile)
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Tests (includes migration round-trip and model/migration drift check)
        run: pytest

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (dashboard, demo page and widget.js)
        run: npm run build

  docker:
    name: Production image (deploy on main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token to exchange with Google
    env:
      DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      # Everything below runs only on main, after every test above has passed.
      # Keyless: Workload Identity Federation swaps GitHub's short-lived OIDC token for
      # Google credentials. No service account key is stored in GitHub, and Google only
      # accepts tokens from this repository.
      - name: Authenticate to Google Cloud
        if: env.DEPLOY == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/918469824880/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@kilau-assistant.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        if: env.DEPLOY == 'true'
      - name: Push the image to Artifact Registry
        if: env.DEPLOY == 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
      # Migrate before the new code goes live: migrations must stay compatible with the
      # code that is still serving (add columns first, drop them in a later release).
      - name: Run database migrations
        if: env.DEPLOY == 'true'
        run: |
          gcloud run jobs update migrate --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID"
          gcloud run jobs execute migrate --region "$REGION" --project "$PROJECT_ID" --wait
      # Only the image changes here; env vars, secrets and scaling are the service's own
      # config (set once, see README) and carry over to the new revision.
      - name: Deploy to Cloud Run
        if: env.DEPLOY == 'true'
        run: |
          gcloud run deploy kilau --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID"
      # The one-off command job and the nightly demo reset run the same code as the app.
      - name: Update the other jobs
        if: env.DEPLOY == 'true'
        run: |
          for job in manage demo-reset; do
            gcloud run jobs update "$job" --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID"
          done
      # The same image, deployed a second time for the real business (Cuci-Cuci Senawang):
      # its own database, secrets and settings. Skipped until that service has been set up
      # by hand, so a merge can never create it with the demo's defaults.
      - name: Deploy the Cuci-Cuci Senawang service
        if: env.DEPLOY == 'true'
        run: |
          if ! gcloud run services describe cuci-cuci --region "$REGION" --project "$PROJECT_ID" > /dev/null 2>&1; then
            echo "cuci-cuci is not set up yet; skipping"
            exit 0
          fi
          gcloud run jobs update cc-migrate --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID"
          gcloud run jobs execute cc-migrate --region "$REGION" --project "$PROJECT_ID" --wait
          gcloud run deploy cuci-cuci --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID"
          gcloud run jobs update cc-manage --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID"
