name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same image as docker-compose.yml, so tests run against real Postgres + pgvector.
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: carpet
          POSTGRES_PASSWORD: carpet
          POSTGRES_DB: carpet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carpet -d carpet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carpet:carpet@127.0.0.1:5432/carpet
      TEST_DATABASE_URL: postgresql+psycopg://carpet:carpet@127.0.0.1:5432/carpet_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # the production version (Dockerfile)
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Tests (includes migration round-trip and model/migration drift check)
        run: pytest

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (dashboard, demo page and widget.js)
        run: npm run build

  docker:
    name: Production image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image (not pushed)
        run: docker build -t carpet-ai-assistant:ci .
